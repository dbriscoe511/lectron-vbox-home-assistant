# Unofficial Lectron profile. Writes: charging request, supported current, mode.
# DP6 on tested firmware: V(2), I(3), P(3), session energy(4), big-endian.
name: Lectron V-BOX Pro EV charger
products:
  - id: xoiejlwg1pq0ehpk
    manufacturer: Lectron
    model: V-BOX Pro NACS Wi-Fi
entities:
  - entity: sensor
    name: Status
    class: enum
    icon: mdi:ev-station
    dps:
      - id: 3
        type: string
        name: sensor
        mapping:
          - dps_val: charger_free
            value: available
          - dps_val: charger_insert
            value: plugged_in
          - dps_val: charger_free_fault
            value: fault_unplugged
          - dps_val: charger_wait
            value: waiting
          - dps_val: charger_charging
            value: charging
          - dps_val: charger_pause
            value: paused
          - dps_val: charger_end
            value: session_ended
          - dps_val: charger_fault
            value: fault
          - dps_val: charger_suddenStop
            value: interrupted
          - value: null
            hidden: true
  - entity: sensor
    name: Total energy
    class: energy
    dps:
      - id: 1
        type: integer
        name: sensor
        unit: kWh
        class: total_increasing
        mapping:
          - scale: 100
  - entity: sensor
    name: Session energy
    class: energy
    icon: mdi:lightning-bolt
    dps:
      - id: 25
        type: integer
        name: sensor
        unit: kWh
        mapping:
          - scale: 100
  - entity: sensor
    name: Phase session energy
    class: energy
    icon: mdi:lightning-bolt
    dps:
      - id: 6
        type: base64
        name: sensor
        optional: true
        # Status polls omit DP6; request it on the existing connection.
        force: true
        persist: false
        unit: kWh
        mask: "0000000000000000FFFFFFFF"
        mapping:
          - scale: 100
      - id: 6
        type: string
        name: raw_phase_packet
        optional: true
        persist: false
      - id: 6
        type: string
        name: available
        optional: true
        persist: false
        mapping:
          - dps_val: null
            value: false
          - value: true
  - entity: sensor
    name: Internal temperature
    class: temperature
    category: diagnostic
    dps:
      - id: 24
        type: integer
        name: sensor
        unit: F
        class: measurement
  - entity: sensor
    name: Current limit
    class: current
    category: diagnostic
    icon: mdi:current-ac
    dps:
      - id: 4
        type: integer
        name: sensor
        unit: A
  - entity: select
    name: Charging current
    icon: mdi:current-ac
    dps:
      - id: 4
        type: integer
        name: option
        mapping:
          - dps_val: 16
            value: 16 A
          - dps_val: 32
            value: 32 A
          - dps_val: 40
            value: 40 A
          - dps_val: 48
            value: 48 A
          - value: null
            hidden: true
  - entity: binary_sensor
    name: Charging
    class: battery_charging
    dps:
      - id: 3
        type: string
        name: sensor
        mapping:
          - dps_val: charger_charging
            value: true
          - dps_val: charger_free
            value: false
          - dps_val: charger_insert
            value: false
          - dps_val: charger_free_fault
            value: false
          - dps_val: charger_wait
            value: false
          - dps_val: charger_pause
            value: false
          - dps_val: charger_end
            value: false
          - dps_val: charger_fault
            value: false
          - dps_val: charger_suddenStop
            value: false
          - value: null
            hidden: true
  - entity: binary_sensor
    name: Vehicle connected
    class: plug
    dps:
      - id: 13
        type: string
        name: sensor
        mapping:
          - dps_val: controlpi_12v
            value: false
          - dps_val: controlpi_12v_pwm
            value: false
          - dps_val: controlpi_9v
            value: true
          - dps_val: controlpi_9v_pwm
            value: true
          - dps_val: controlpi_6v
            value: true
          - dps_val: controlpi_6v_pwm
            value: true
          - value: null
            hidden: true
  - entity: binary_sensor
    name: Problem
    class: problem
    category: diagnostic
    dps:
      - id: 10
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - dps_val: null
            value: null
            hidden: true
          - value: true
      - id: 10
        type: bitfield
        name: fault_code
  - entity: sensor
    name: Fault code
    category: diagnostic
    hidden: true
    icon: mdi:alert-circle-outline
    dps:
      - id: 10
        type: bitfield
        name: sensor
  - entity: sensor
    name: Connection state
    class: enum
    category: diagnostic
    icon: mdi:ev-plug-tesla
    dps:
      - id: 13
        type: string
        name: sensor
        mapping:
          - dps_val: controlpi_12v
            value: standby
          - dps_val: controlpi_12v_pwm
            value: initializing
          - dps_val: controlpi_9v
            value: vehicle_detected
          - dps_val: controlpi_9v_pwm
            value: vehicle_connected
          - dps_val: controlpi_6v
            value: ready_to_charge
          - dps_val: controlpi_6v_pwm
            value: charging
          - dps_val: controlpi_error
            value: error
          - value: null
            hidden: true
  - entity: sensor
    name: Charging mode
    class: enum
    category: diagnostic
    icon: mdi:ev-station
    dps:
      - id: 14
        type: string
        name: sensor
        mapping:
          - dps_val: charge_now
            value: immediate
          - dps_val: charge_energy
            value: energy_target
          - dps_val: charge_schedule
            value: scheduled
          - dps_val: charge_manual
            value: manual
          - value: null
            hidden: true
  - entity: switch
    name: Charging request
    icon: mdi:ev-station
    dps:
      - id: 18
        type: boolean
        name: switch
  - entity: select
    name: Operating mode
    category: config
    icon: mdi:ev-station
    dps:
      - id: 14
        type: string
        name: option
        mapping:
          - dps_val: charge_now
            value: Plug and charge
            constraint: charging_state
            conditions:
              - dps_val: charger_charging
                invalid: true
          - dps_val: charge_manual
            value: Manual start
            constraint: charging_state
            conditions:
              - dps_val: charger_charging
                invalid: true
          - dps_val: charge_schedule
            value: Scheduled charge
            constraint: charging_state
            conditions:
              - dps_val: charger_charging
                invalid: true
          - value: null
            hidden: true
      - id: 3
        type: string
        name: charging_state
        hidden: true
      - id: 3
        type: string
        name: available
        mapping:
          - dps_val: charger_free
            value: true
          - dps_val: charger_insert
            value: true
          - dps_val: charger_wait
            value: true
          - dps_val: charger_pause
            value: true
          - dps_val: charger_end
            value: true
          - value: false
  - entity: binary_sensor
    name: Charge request
    category: diagnostic
    icon: mdi:power
    dps:
      - id: 18
        type: boolean
        name: sensor
  - entity: binary_sensor
    name: Hardwired detected
    category: diagnostic
    icon: mdi:power-plug
    dps:
      - id: 103
        type: boolean
        name: sensor
        optional: true
  - entity: sensor
    name: Firmware
    category: diagnostic
    icon: mdi:chip
    dps:
      - id: 23
        type: string
        name: sensor
  - entity: sensor
    name: Reported online state
    category: diagnostic
    hidden: true
    icon: mdi:cloud-question
    dps:
      - id: 27
        type: string
        name: sensor
        optional: true
  - entity: sensor
    name: Energy balance
    category: diagnostic
    hidden: true
    class: energy
    dps:
      - id: 15
        type: integer
        name: sensor
        optional: true
        unit: kWh
        mapping:
          - scale: 100
  - entity: sensor
    name: Charging power
    class: power
    dps:
      - id: 6
        type: base64
        name: sensor
        optional: true
        persist: false
        unit: kW
        mask: 0000000000FFFFFF00000000
        class: measurement
        mapping:
          - scale: 1000
      - id: 6
        type: base64
        name: available
        optional: true
        persist: false
        mapping:
          - dps_val: null
            value: false
          - value: false
            constraint: charging_state
            conditions:
              - dps_val: charger_charging
                value: true
      - id: 3
        type: string
        name: charging_state
  - entity: sensor
    name: Single phase power
    class: power
    dps:
      - id: 5
        type: integer
        name: sensor
        optional: true
        persist: false
        unit: kW
        class: measurement
        mapping:
          - scale: 1000
      - id: 5
        type: integer
        name: available
        optional: true
        persist: false
        mapping:
          - dps_val: null
            value: false
          - value: true
  - entity: sensor
    name: Voltage
    class: voltage
    dps:
      - id: 6
        type: base64
        name: sensor
        optional: true
        persist: false
        unit: V
        mask: FFFF00000000000000000000
        class: measurement
        mapping:
          - scale: 10
      - id: 6
        type: base64
        name: available
        optional: true
        persist: false
        mapping:
          - dps_val: null
            value: false
          - value: false
            constraint: charging_state
            conditions:
              - dps_val: charger_charging
                value: true
      - id: 3
        type: string
        name: charging_state
  - entity: sensor
    name: Current
    class: current
    dps:
      - id: 6
        type: base64
        name: sensor
        optional: true
        persist: false
        unit: A
        mask: 0000FFFFFF00000000000000
        class: measurement
        mapping:
          - scale: 1000
      - id: 6
        type: base64
        name: available
        optional: true
        persist: false
        mapping:
          - dps_val: null
            value: false
          - value: false
            constraint: charging_state
            conditions:
              - dps_val: charger_charging
                value: true
      - id: 3
        type: string
        name: charging_state
  - entity: binary_sensor
    name: Scheduled charge needs plug
    class: problem
    category: diagnostic
    hidden: true
    dps:
      - id: 101
        type: boolean
        name: sensor
        optional: true
