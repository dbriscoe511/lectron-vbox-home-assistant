name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/checkout@v4
        with:
          repository: dbriscoe511/tuya-local
          ref: lectron-vbox-pro-2026.11.11
          path: .upstream-tuya-local
      - run: python -m pip install -r requirements-test.txt
      - run: pytest -q
        env:
          TUYA_LOCAL_SOURCE: ${{ github.workspace }}/.upstream-tuya-local
