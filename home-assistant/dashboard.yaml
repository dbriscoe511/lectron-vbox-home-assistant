title: EV charging
views:
  - title: Charging
    path: charging
    icon: mdi:ev-station
    cards:
      - type: horizontal-stack
        cards:
          - type: button
            name: Start charging now
            icon: mdi:ev-station
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.lectron_charge_now
          - type: button
            name: Stop charging
            icon: mdi:stop
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.lectron_stop_charging
      - type: entities
        title: Charger
        show_header_toggle: false
        entities:
          - entity: binary_sensor.lectron_charging_allowed
            name: Automatic charging allowed
          - entity: binary_sensor.lectron_manual_override_active
            name: Manual session override
          - entity: binary_sensor.lectron_v_box_pro_charge_request
            name: Charger request
          - entity: select.lectron_v_box_pro_charging_current
            name: Charging current
          - entity: sensor.lectron_v_box_pro_status
            name: Status
          - entity: binary_sensor.lectron_v_box_pro_vehicle_connected
            name: Vehicle connected
          - entity: binary_sensor.lectron_v_box_pro_charging
            name: Charging reported
          - entity: sensor.lectron_v_box_pro_phase_session_energy
            name: Session energy
          - entity: sensor.lectron_v_box_pro_session_energy
            name: Last session / checkpoint
          - entity: sensor.lectron_v_box_pro_total_energy
            name: Lifetime meter
          - entity: sensor.lectron_v_box_pro_current_limit
            name: Configured current limit
          - entity: sensor.lectron_v_box_pro_internal_temperature
            name: Internal temperature
          - entity: sensor.lectron_v_box_pro_voltage
            name: Reported voltage
          - entity: sensor.lectron_v_box_pro_current
            name: Measured current
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: sensor.lectron_energy_today
            name: Today
          - type: tile
            entity: sensor.lectron_energy_this_month
            name: This month
      - type: statistics-graph
        title: Daily charging energy
        chart_type: bar
        period: day
        days_to_show: 30
        stat_types:
          - change
        entities:
          - entity: sensor.lectron_v_box_pro_total_energy
            name: Charging energy
      - type: history-graph
        title: Charger activity
        hours_to_show: 24
        entities:
          - entity: sensor.lectron_v_box_pro_status
            name: Status
          - entity: binary_sensor.lectron_v_box_pro_vehicle_connected
            name: Plug connection
      - type: conditional
        conditions:
          - entity: sensor.lectron_v_box_pro_charging_power
            state_not: unavailable
          - entity: sensor.lectron_v_box_pro_charging_power
            state_not: unknown
        card:
          type: tile
          entity: sensor.lectron_v_box_pro_charging_power
          name: Reported charging power
      - type: conditional
        conditions:
          - entity: binary_sensor.lectron_v_box_pro_problem
            state: 'on'
        card:
          type: entities
          title: Charger fault
          entities:
            - binary_sensor.lectron_v_box_pro_problem
            - sensor.lectron_fault_details
      - type: entities
        title: Flat-rate cost estimate (optional)
        show_header_toggle: false
        entities:
          - entity: input_number.lectron_flat_electricity_rate
            name: Electricity rate · USD/kWh
          - entity: sensor.lectron_estimated_session_cost
            name: Estimated session / last-session cost
  - title: Diagnostics
    path: diagnostics
    icon: mdi:information-outline
    cards:
      - type: entities
        title: Charger diagnostics
        show_header_toggle: false
        entities:
          - sensor.lectron_v_box_pro_firmware
          - sensor.lectron_v_box_pro_charging_mode
          - sensor.lectron_v_box_pro_connection_state
          - binary_sensor.lectron_v_box_pro_charge_request
          - binary_sensor.lectron_v_box_pro_hardwired_detected
          - binary_sensor.lectron_v_box_pro_problem
          - sensor.lectron_fault_details
  - title: Energy history
    path: energy-history
    icon: mdi:chart-bar
    cards:
      - type: statistics-graph
        title: Monthly charging energy
        chart_type: bar
        period: month
        days_to_show: 210
        stat_types:
          - change
        entities:
          - entity: sensor.lectron_v_box_pro_total_energy
            name: Charger energy
      - type: statistics-graph
        title: Daily charging energy
        chart_type: bar
        period: day
        days_to_show: 90
        stat_types:
          - change
        entities:
          - entity: sensor.lectron_v_box_pro_total_energy
            name: Charger energy
