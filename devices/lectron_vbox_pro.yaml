# Unofficial Lectron V-BOX Pro NACS Wi-Fi profile; only DP18 is writable.
# Units/enums are taken from this product's own Tuya schema, not another EVSE.
# Tested: hardware V1.2, firmware V2.0.1, Tuya LAN 3.5.
name: Lectron V-BOX Pro EV charger
products:
  - id: xoiejlwg1pq0ehpk
    manufacturer: Lectron
    model: V-BOX Pro NACS Wi-Fi
entities:
  - entity: sensor
    name: Status
    class: enum
    icon: mdi:ev-station
    dps:
      - id: 3
        type: string
        name: sensor
        mapping:
          - dps_val: charger_free
            value: available
          - dps_val: charger_insert
            value: plugged_in
          - dps_val: charger_free_fault
            value: fault_unplugged
          - dps_val: charger_wait
            value: waiting
          - dps_val: charger_charging
            value: charging
          - dps_val: charger_pause
            value: paused
          - dps_val: charger_end
            value: session_ended
          - dps_val: charger_fault
            value: fault
          - dps_val: charger_suddenStop
            value: interrupted
          - value: null
            hidden: true
  - entity: sensor
    name: Total energy
    class: energy
    dps:
      - id: 1
        type: integer
        name: sensor
        unit: kWh
        class: total_increasing
        mapping:
          - scale: 100
  - entity: sensor
    name: Session energy
    class: energy
    icon: mdi:lightning-bolt
    dps:
      - id: 25
        type: integer
        name: sensor
        unit: kWh
        mapping:
          - scale: 100
  - entity: sensor
    name: Internal temperature
    class: temperature
    category: diagnostic
    dps:
      - id: 24
        type: integer
        name: sensor
        unit: F
        class: measurement
  - entity: sensor
    name: Current limit
    class: current
    category: diagnostic
    icon: mdi:current-ac
    dps:
      - id: 4
        type: integer
        name: sensor
        unit: A
  - entity: binary_sensor
    name: Charging
    class: battery_charging
    dps:
      - id: 3
        type: string
        name: sensor
        mapping:
          - dps_val: charger_charging
            value: true
          - dps_val: charger_free
            value: false
          - dps_val: charger_insert
            value: false
          - dps_val: charger_free_fault
            value: false
          - dps_val: charger_wait
            value: false
          - dps_val: charger_pause
            value: false
          - dps_val: charger_end
            value: false
          - dps_val: charger_fault
            value: false
          - dps_val: charger_suddenStop
            value: false
          - value: null
            hidden: true
  - entity: binary_sensor
    name: Vehicle connected
    class: plug
    dps:
      - id: 13
        type: string
        name: sensor
        mapping:
          - dps_val: controlpi_12v
            value: false
          - dps_val: controlpi_12v_pwm
            value: false
          - dps_val: controlpi_9v
            value: true
          - dps_val: controlpi_9v_pwm
            value: true
          - dps_val: controlpi_6v
            value: true
          - dps_val: controlpi_6v_pwm
            value: true
          - value: null
            hidden: true
  - entity: binary_sensor
    name: Problem
    class: problem
    category: diagnostic
    dps:
      - id: 10
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - dps_val: null
            value: null
            hidden: true
          - value: true
      - id: 10
        type: bitfield
        name: fault_code
  - entity: sensor
    name: Fault code
    category: diagnostic
    hidden: true
    icon: mdi:alert-circle-outline
    dps:
      - id: 10
        type: bitfield
        name: sensor
  - entity: sensor
    name: Connection state
    class: enum
    category: diagnostic
    icon: mdi:ev-plug-tesla
    dps:
      - id: 13
        type: string
        name: sensor
        mapping:
          - dps_val: controlpi_12v
            value: standby
          - dps_val: controlpi_12v_pwm
            value: initializing
          - dps_val: controlpi_9v
            value: vehicle_detected
          - dps_val: controlpi_9v_pwm
            value: vehicle_connected
          - dps_val: controlpi_6v
            value: ready_to_charge
          - dps_val: controlpi_6v_pwm
            value: charging
          - dps_val: controlpi_error
            value: error
          - value: null
            hidden: true
  - entity: sensor
    name: Charging mode
    class: enum
    category: diagnostic
    icon: mdi:ev-station
    dps:
      - id: 14
        type: string
        name: sensor
        mapping:
          - dps_val: charge_now
            value: immediate
          - dps_val: charge_energy
            value: energy_target
          - dps_val: charge_schedule
            value: scheduled
          - dps_val: charge_manual
            value: manual
          - value: null
            hidden: true
  - entity: switch
    name: Charging request
    icon: mdi:ev-station
    dps:
      - id: 18
        type: boolean
        name: switch
  - entity: binary_sensor
    name: Charge request
    category: diagnostic
    icon: mdi:power
    dps:
      - id: 18
        type: boolean
        name: sensor
  - entity: binary_sensor
    name: Hardwired detected
    category: diagnostic
    icon: mdi:power-plug
    dps:
      - id: 103
        type: boolean
        name: sensor
  - entity: sensor
    name: Firmware
    category: diagnostic
    icon: mdi:chip
    dps:
      - id: 23
        type: string
        name: sensor
  - entity: sensor
    name: Reported online state
    category: diagnostic
    hidden: true
    icon: mdi:cloud-question
    dps:
      - id: 27
        type: string
        name: sensor
        optional: true
  - entity: sensor
    name: Energy balance
    category: diagnostic
    hidden: true
    class: energy
    dps:
      - id: 15
        type: integer
        name: sensor
        optional: true
        unit: kWh
        mapping:
          - scale: 100
  # Supported by the manufacturer schema, not present in the idle test response.
  # Missing instantaneous values must not keep the preceding charge's reading.
  - entity: sensor
    name: Charging power
    class: power
    dps:
      - id: 9
        type: integer
        name: sensor
        optional: true
        persist: false
        unit: kW
        class: measurement
        mapping:
          - scale: 1000
      - id: 9
        type: integer
        name: available
        optional: true
        persist: false
        mapping:
          - dps_val: null
            value: false
          - value: true
  - entity: sensor
    name: Single phase power
    class: power
    dps:
      - id: 5
        type: integer
        name: sensor
        optional: true
        persist: false
        unit: kW
        class: measurement
        mapping:
          - scale: 1000
  # Conventional Tuya phase_a 2/3/3-byte layout; unverified on a live charge.
  # Explicitly disabled until an owner compares it to the app during charging.
      - id: 5
        type: integer
        name: available
        optional: true
        persist: false
        mapping:
          - dps_val: null
            value: false
          - value: true
  - entity: sensor
    name: Voltage
    class: voltage
    hidden: true
    dps:
      - id: 6
        type: base64
        name: sensor
        optional: true
        persist: false
        unit: V
        mask: FFFF000000000000
        class: measurement
        mapping:
          - scale: 10
  - entity: sensor
    name: Current
    class: current
    hidden: true
    dps:
      - id: 6
        type: base64
        name: sensor
        optional: true
        persist: false
        unit: A
        mask: 0000FFFFFF000000
        class: measurement
        mapping:
          - scale: 1000
  - entity: binary_sensor
    name: Scheduled charge needs plug
    class: problem
    category: diagnostic
    hidden: true
    dps:
      - id: 101
        type: boolean
        name: sensor
        optional: true

